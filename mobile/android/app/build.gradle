plugins { id 'com.android.application' }

android {
    namespace 'com.alcomet.rollingcoilarchive'
    compileSdk 35

    defaultConfig {
        applicationId 'com.alcomet.rollingcoilarchive'
        minSdk 26
        targetSdk 35
        versionCode 14
        versionName '1.3.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
