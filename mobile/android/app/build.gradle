plugins { id 'com.android.application' }

android {
    namespace 'com.alcomet.rollingcoilarchive'
    compileSdk 35

    defaultConfig {
        applicationId 'com.alcomet.rollingcoilarchive'
        minSdk 26
        targetSdk 35
        versionCode 18
        versionName '1.5.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.zxing:core:3.5.3'
}
