name: Build Alcomet Mobile Apps

on:
  push:
    branches: [ mobile-build ]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-build.yml'
  workflow_dispatch:

jobs:
  android:
    name: Android v1.6.0 Production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore persistent Alcomet signing identity
        uses: actions/cache@v4
        with:
          path: ~/.alcomet-signing
          key: alcomet-android-release-signing-v1
      - name: Ensure Android SDK 35
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Initialize signing identity
        shell: bash
        run: |
          set -euo pipefail
          SIGN_DIR="$HOME/.alcomet-signing"
          KEYSTORE="$SIGN_DIR/alcomet-release.jks"
          STOREPASS="$SIGN_DIR/storepass.txt"
          KEYPASS="$SIGN_DIR/keypass.txt"
          mkdir -p "$SIGN_DIR" && chmod 700 "$SIGN_DIR"
          if [ ! -s "$KEYSTORE" ] || [ ! -s "$STOREPASS" ] || [ ! -s "$KEYPASS" ]; then
            rm -f "$KEYSTORE" "$STOREPASS" "$KEYPASS"
            PASS="$(openssl rand -hex 32)"
            printf '%s\n' "$PASS" > "$STOREPASS"
            printf '%s\n' "$PASS" > "$KEYPASS"
            chmod 600 "$STOREPASS" "$KEYPASS"
            keytool -genkeypair -keystore "$KEYSTORE" -storepass "$PASS" -keypass "$PASS" -alias alcometcoil -keyalg RSA -keysize 4096 -validity 10000 -dname 'CN=Alcomet Rolling Shop Coil Archive, OU=Rolling Shop, O=Alcomet AD, L=Shumen, C=BG'
          fi
          test -s "$KEYSTORE" && test -s "$STOREPASS" && test -s "$KEYPASS"
      - name: Apply and validate Android v1.6.0
        run: |
          set -euo pipefail
          python3 -m py_compile mobile/android/patch_v140.py mobile/android/patch_v141.py mobile/android/patch_v142.py mobile/android/patch_v150.py mobile/android/patch_v151.py mobile/android/patch_v152.py mobile/android/patch_v153.py mobile/android/patch_v154.py mobile/android/patch_v160.py
          for P in 140 141 142 150 151 152 153 154 160; do python3 "mobile/android/patch_v${P}.py"; done
          SRC=mobile/android/app/src/main/java/com/alcomet/rollingcoilarchive/MobileActivity.java
          SCAN=mobile/android/app/src/main/java/com/alcomet/rollingcoilarchive/BarcodeScannerActivity.java
          FAV=mobile/android/app/src/main/java/com/alcomet/rollingcoilarchive/FavoritesActivity.java
          STORE=mobile/android/app/src/main/java/com/alcomet/rollingcoilarchive/MobileWatchStore.java
          NOTIFY=mobile/android/app/src/main/java/com/alcomet/rollingcoilarchive/NotificationJobService.java
          NAMES=mobile/android/app/src/main/java/com/alcomet/rollingcoilarchive/MachineNames.java
          SAFE=mobile/android/app/src/main/java/com/alcomet/rollingcoilarchive/SafeMobileActivity.java
          MANIFEST=mobile/android/app/src/main/AndroidManifest.xml
          grep -q 'APP_VERSION = "1.6.0"' "$SRC"
          grep -q 'mobileFeatureRail' "$SRC"
          grep -q 'Gravity.CENTER_HORIZONTAL|Gravity.BOTTOM' "$SRC"
          grep -q 'verifyPolicyForAction(true)' "$SRC"
          grep -q 'verifyPolicyForAction(false)' "$SRC"
          grep -q 'FILE_READ_TIMEOUT_MS = 180000' "$SRC"
          grep -q 'SCAN COIL' "$SCAN"
          grep -q 'AUTO SCANNING' "$SCAN"
          grep -q 'DecodeHintType.TRY_HARDER' "$SCAN"
          grep -q 'onResume()' "$SCAN"
          grep -q 'FAVORITES' "$FAV"
          grep -q 'policyUnavailable' "$FAV"
          grep -q 'Test Notification' "$FAV"
          grep -q 'already in Favorites' "$FAV"
          grep -q 'getNotificationWatches' "$STORE"
          grep -q 'setLastPoll(this,now)' "$NOTIFY"
          grep -q 'MachineNames.label(machine)' "$NOTIFY"
          grep -q 'case "MINO": return "MINO"' "$NAMES"
          grep -q 'case "CM": return "CM"' "$NAMES"
          grep -q 'case "FM1": return "Foil Mill 1"' "$NAMES"
          grep -q 'Android production • v1.6.0' "$SAFE"
          grep -q 'android.permission.VIBRATE' "$MANIFEST"
          grep -q 'android.permission.CAMERA' "$MANIFEST"
          grep -q 'android.permission.POST_NOTIFICATIONS' "$MANIFEST"
          grep -q 'android:name=".FavoritesActivity"' "$MANIFEST"
          ! grep -Rqi 'firebase\|fcm.googleapis\|onesignal' mobile/android/app/src/main/java
          ! grep -A75 'private void saveHttpDownload' "$SRC" | grep -q 'web.getUrl()'
          grep -q 'port==5050' mobile/android/app/src/main/java/com/alcomet/rollingcoilarchive/MainActivity.java
          grep -q "versionCode 22" mobile/android/app/build.gradle
          grep -q "versionName '1.6.0'" mobile/android/app/build.gradle
      - name: Build release APK
        working-directory: mobile/android
        run: gradle --no-daemon clean assembleRelease
      - name: Sign and verify production APK
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          UNSIGNED="mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          OUT="Alcomet_Rolling_Shop_Coil_Archive_Android_v1.6.0.apk"
          test -s "$UNSIGNED"
          "$BT/apksigner" sign --ks "$HOME/.alcomet-signing/alcomet-release.jks" --ks-key-alias alcometcoil --ks-pass "file:$HOME/.alcomet-signing/storepass.txt" --key-pass "file:$HOME/.alcomet-signing/keypass.txt" --out "$OUT" "$UNSIGNED"
          "$BT/apksigner" verify --verbose --print-certs "$OUT" | tee apk-signing.txt
          "$BT/aapt" dump badging "$OUT" | tee apk-badging.txt
          "$BT/aapt" dump permissions "$OUT" | tee apk-permissions.txt
          grep -q "package: name='com.alcomet.rollingcoilarchive'" apk-badging.txt
          grep -q "versionCode='22' versionName='1.6.0'" apk-badging.txt
          grep -q "launchable-activity: name='com.alcomet.rollingcoilarchive.SafeMobileActivity'" apk-badging.txt
          grep -q 'android.permission.CAMERA' apk-permissions.txt
          grep -q 'android.permission.VIBRATE' apk-permissions.txt
          grep -q 'Verified using v2 scheme.*true' apk-signing.txt
          grep -q 'Verified using v3 scheme.*true' apk-signing.txt
          sha256sum "$OUT" > Alcomet_Rolling_Shop_Coil_Archive_Android_v1.6.0_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Alcomet-Rolling-Shop-Coil-Archive-Android-v1.6.0-Production
          path: |
            Alcomet_Rolling_Shop_Coil_Archive_Android_v1.6.0.apk
            Alcomet_Rolling_Shop_Coil_Archive_Android_v1.6.0_SHA256.txt
            apk-badging.txt
            apk-permissions.txt
            apk-signing.txt
          if-no-files-found: error

  ios:
    name: iOS v1.6.0 Unsigned IPA
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Validate iOS sources and plist
        run: |
          set -euo pipefail
          plutil -lint mobile/ios/AlcometCoilArchive/Info.plist
          grep -q '<string>1.6.0</string>' mobile/ios/AlcometCoilArchive/Info.plist
          grep -q 'NSCameraUsageDescription' mobile/ios/AlcometCoilArchive/Info.plist
          grep -q 'NSLocalNetworkUsageDescription' mobile/ios/AlcometCoilArchive/Info.plist
          grep -q 'barcode.viewfinder' mobile/ios/AlcometCoilArchive/AlcometCoilArchiveApp.swift
          grep -q 'struct FavoritesView' mobile/ios/AlcometCoilArchive/AlcometCoilArchiveApp.swift
          grep -q 'Test notification' mobile/ios/AlcometCoilArchive/AlcometCoilArchiveApp.swift
          grep -q 'nativePdfShare' mobile/ios/AlcometCoilArchive/AlcometCoilArchiveApp.swift
          grep -q 'port == 5050' mobile/ios/AlcometCoilArchive/AlcometCoilArchiveApp.swift
      - name: Build arm64 iPhone app without signing
        run: |
          set -euo pipefail
          mkdir -p build/ios
          xcodebuild -project mobile/ios/AlcometCoilArchive.xcodeproj -target AlcometCoilArchive -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CONFIGURATION_BUILD_DIR="$PWD/build/ios" build | tee ios-build.txt
          APP=$(find build/ios -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP"
          test -s "$APP/AlcometCoilArchive"
          plutil -p "$APP/Info.plist" | tee ios-info.txt
          grep -q '"CFBundleShortVersionString" => "1.6.0"' ios-info.txt
          grep -q '"NSCameraUsageDescription"' ios-info.txt
      - name: Package unsigned IPA and source
        run: |
          set -euo pipefail
          APP=$(find build/ios -maxdepth 1 -type d -name '*.app' -print -quit)
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry Alcomet_Rolling_Shop_Coil_Archive_iOS_v1.6.0_unsigned.ipa Payload
          /usr/bin/zip -qry Alcomet_Rolling_Shop_Coil_Archive_iOS_v1.6.0_Xcode_Source.zip mobile/ios
          test -s Alcomet_Rolling_Shop_Coil_Archive_iOS_v1.6.0_unsigned.ipa
          unzip -tq Alcomet_Rolling_Shop_Coil_Archive_iOS_v1.6.0_unsigned.ipa
          shasum -a 256 Alcomet_Rolling_Shop_Coil_Archive_iOS_v1.6.0_unsigned.ipa > Alcomet_Rolling_Shop_Coil_Archive_iOS_v1.6.0_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Alcomet-Rolling-Shop-Coil-Archive-iOS-v1.6.0-Unsigned
          path: |
            Alcomet_Rolling_Shop_Coil_Archive_iOS_v1.6.0_unsigned.ipa
            Alcomet_Rolling_Shop_Coil_Archive_iOS_v1.6.0_Xcode_Source.zip
            Alcomet_Rolling_Shop_Coil_Archive_iOS_v1.6.0_SHA256.txt
            ios-build.txt
            ios-info.txt
          if-no-files-found: error
