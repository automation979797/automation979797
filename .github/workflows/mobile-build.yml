name: Build Alcomet Mobile Apps

on:
  push:
    branches: [ mobile-build ]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-build.yml'
  workflow_dispatch:

jobs:
  android:
    name: Android Production APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore persistent Alcomet signing identity
        uses: actions/cache@v4
        with:
          path: ~/.alcomet-signing
          key: alcomet-android-release-signing-v1

      - name: Ensure Android SDK 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
          fi

      - name: Initialize signing identity on first production build
        shell: bash
        run: |
          set -euo pipefail
          SIGN_DIR="$HOME/.alcomet-signing"
          KEYSTORE="$SIGN_DIR/alcomet-release.jks"
          PASSFILE="$SIGN_DIR/password.txt"
          mkdir -p "$SIGN_DIR"
          chmod 700 "$SIGN_DIR"
          if [ ! -s "$KEYSTORE" ] || [ ! -s "$PASSFILE" ]; then
            PASS="$(openssl rand -hex 32)"
            printf '%s' "$PASS" > "$PASSFILE"
            chmod 600 "$PASSFILE"
            keytool -genkeypair \
              -keystore "$KEYSTORE" \
              -storepass "$PASS" \
              -keypass "$PASS" \
              -alias alcometcoil \
              -keyalg RSA \
              -keysize 4096 \
              -validity 10000 \
              -dname 'CN=Alcomet Rolling Shop Coil Archive, OU=Rolling Shop, O=Alcomet AD, L=Shumen, C=BG'
          fi
          test -s "$KEYSTORE"
          test -s "$PASSFILE"

      - name: Stamp wrapper version
        run: |
          sed -i 's/APP_VERSION = "1.2.0"/APP_VERSION = "1.3.1"/' mobile/android/app/src/main/java/com/alcomet/rollingcoilarchive/MobileActivity.java
          grep -q 'APP_VERSION = "1.3.1"' mobile/android/app/src/main/java/com/alcomet/rollingcoilarchive/MobileActivity.java

      - name: Build unsigned production APK
        working-directory: mobile/android
        run: gradle --no-daemon clean assembleRelease

      - name: Sign and verify production APK
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          UNSIGNED="mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          OUT="Alcomet_Rolling_Shop_Coil_Archive_Android_v1.3.1.apk"
          test -s "$UNSIGNED"
          "$BT/apksigner" sign \
            --ks "$HOME/.alcomet-signing/alcomet-release.jks" \
            --ks-key-alias alcometcoil \
            --ks-pass "file:$HOME/.alcomet-signing/password.txt" \
            --key-pass "file:$HOME/.alcomet-signing/password.txt" \
            --out "$OUT" \
            "$UNSIGNED"
          "$BT/apksigner" verify --verbose --print-certs "$OUT"
          "$BT/aapt" dump badging "$OUT" | tee apk-badging.txt
          grep -q "package: name='com.alcomet.rollingcoilarchive'" apk-badging.txt
          grep -q "launchable-activity: name='com.alcomet.rollingcoilarchive.SafeMobileActivity'" apk-badging.txt
          sha256sum "$OUT" > Alcomet_Rolling_Shop_Coil_Archive_Android_v1.3.1_SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Alcomet-Rolling-Shop-Coil-Archive-Android-v1.3.1-Production
          path: |
            Alcomet_Rolling_Shop_Coil_Archive_Android_v1.3.1.apk
            Alcomet_Rolling_Shop_Coil_Archive_Android_v1.3.1_SHA256.txt
            apk-badging.txt
          if-no-files-found: error

  ios:
    name: iOS unsigned IPA
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build arm64 iPhone app without signing
        run: |
          mkdir -p build/ios
          xcodebuild \
            -project mobile/ios/AlcometCoilArchive.xcodeproj \
            -target AlcometCoilArchive \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CONFIGURATION_BUILD_DIR="$PWD/build/ios" \
            build
      - name: Package unsigned IPA
        run: |
          APP=$(find build/ios -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry Alcomet_Rolling_Shop_Coil_Archive_iOS_v1.0.0_unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Alcomet-Rolling-Shop-Coil-Archive-iOS-Unsigned-IPA
          path: Alcomet_Rolling_Shop_Coil_Archive_iOS_v1.0.0_unsigned.ipa
          if-no-files-found: error
